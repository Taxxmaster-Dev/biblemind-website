name: Repair approved mobile legal HTML
on:
  push:
    branches:
      - fix/18-mobile-legal-ci-and-live-check-20261023
    paths:
      - 'tool/repair_mobile_legal_docs.py'
      - '.github/workflows/repair-approved-mobile-legal-html.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize 68 translated document HTML pages without altering website notices
        run: python3 tool/repair_mobile_legal_docs.py
      - name: Commit only real legal document repairs to this review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'biblemind-legal-qa-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/
          if git diff --cached --quiet; then
            echo 'All legal documents are already normalized.'
          else
            git commit -m 'fix(legal): repair translated document HTML and local navigation'
            git push origin HEAD:fix/18-mobile-legal-ci-and-live-check-20261023
          fi
