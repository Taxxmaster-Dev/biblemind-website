name: Probe public translation backends (draft only)
on:
  push:
    branches: [fix/mobile-app-legal-locales-20261023]
    paths:
      - '.github/workflows/probe-translation-backends.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test independent public endpoints without using secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request, json, time
          text='This Privacy Policy explains how BibleMind processes personal data.'
          providers={
           'mymemory': 'https://api.mymemory.translated.net/get?'+urllib.parse.urlencode({'q':text,'langpair':'en|de'}),
           'lingva': 'https://lingva.ml/api/v1/en/de/'+urllib.parse.quote(text),
           'google-gtx': 'https://translate.googleapis.com/translate_a/single?'+urllib.parse.urlencode({'client':'gtx','sl':'en','tl':'de','dt':'t','q':text}),
           'simplytranslate': 'https://simplytranslate.org/api/translate?'+urllib.parse.urlencode({'engine':'google','from':'en','to':'de','text':text}),
          }
          for name,url in providers.items():
           try:
            req=urllib.request.Request(url,headers={'User-Agent':'BibleMind-I18n-Verification/1.0'})
            with urllib.request.urlopen(req,timeout=14) as r:
             body=r.read(1500).decode('utf-8','replace')
             print(name,r.status,body[:320],flush=True)
           except Exception as e: print(name,type(e).__name__,str(e)[:250],flush=True)
          PY
