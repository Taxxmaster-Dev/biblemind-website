name: Normalize translated legal HTML
on:
  push:
    branches: [fix/mobile-app-legal-locales-20261023]
    paths: ['.github/workflows/normalize-mobile-legal-html.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove accidental literal html token from machine-generated documents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path("app").glob("*/*.html"):
              s=path.read_text(encoding="utf-8")
              original=s
              s=s.replace("<!doctype html>\nhtml<html", "<!doctype html>\n<html")
              if s != original:
                  path.write_text(s,encoding="utf-8")
                  print("FIXED:",path)
          PY
          git config user.name 'biblemind-legal-localization-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if ! git diff --cached --quiet; then
            git commit -m 'fix(legal): normalize valid HTML for all translated pages'
            git push origin HEAD:fix/mobile-app-legal-locales-20261023
          fi
