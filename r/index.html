<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Get BibleMind · Partner invitation</title><meta property="og:title" content="BibleMind · Your daily Bible companion"><meta property="og:description" content="Follow your promoter’s invitation to get BibleMind."><meta property="og:image" content="https://biblemind.eu/assets/biblemind_logo.png"><style>body{font:16px system-ui,sans-serif;background:#f5f2ea;color:#203029;margin:0;display:grid;place-items:center;min-height:100vh}main{padding:32px;max-width:480px}a{color:#24583c}</style></head><body><main><h1>BibleMind partner link</h1><p id="message">Checking the partner link…</p><noscript>Enable JavaScript to follow this partner link.</noscript></main><script>
const query = new URLSearchParams(location.search);
const agent = query.get('a') || '';
// A sentence-ending period is sometimes included when a social post is copied.
const promoter = (query.get('p') || '').replace(/\.$/, '');
const numeric = /^[0-9]{1,12}$/;
if (numeric.test(agent) && numeric.test(promoter) &&
    query.getAll('a').length === 1 && query.getAll('p').length === 1) {
  location.replace('https://biblemind-tb2c.onrender.com/r/' + agent + '/' + promoter);
} else {
  document.getElementById('message').textContent = 'This partner link is incomplete. Ask the promoter for the full link.';
}
</script></body></html>
